<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-new.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>電波人間 QRコード管理ツール</title>
  <meta
    name="description"
    content="電波人間のステータスとQRコードを登録・検索できる管理ツールです。"
  />
  
  <meta property="og:title" content="電波人間 QRコード管理ツール" />
  <meta
    property="og:description"
    content="電波人間のステータスとQRコードを登録・検索できる管理ツールです。"
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://Toshi0703.github.io/denpa-qr-web/" />
  <meta property="og:image" content="https://Toshi0703.github.io/denpa-qr-web/ogp.png" />
</head>

<body>
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          .join('?')

        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        )
      }
    })(window.location)
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
