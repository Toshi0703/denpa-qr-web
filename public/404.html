<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>電波人間 QRコード管理ツール</title>
  <script>
    (function () {
      var pathSegmentsToKeep = 1;

      var l = window.location;

      l.replace(
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/') +
        '/?/' +
        l.pathname
          .split('/')
          .slice(1 + pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~') +
        (l.search
          ? '&' + l.search.slice(1).replace(/&/g, '~and~')
          : '') +
        l.hash
      );
    }());
  </script>
</head>
<body>
</body>
</html>
